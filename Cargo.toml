[workspace]
resolver = "2"
members = [
    "crates/sach",
    "crates/chinhta",
    "crates/mohinh",
    "crates/giaodien",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

# Nén/giải nén EPUB. `deflate` là thuật toán duy nhất EPUB dùng thật; bỏ phần
# còn lại cho binary gọn.
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Ngay cả bản debug cũng phải tối ưu phần phụ thuộc: llama.cpp và bộ giải nén
# chạy chậm gấp hàng chục lần khi biên dịch không tối ưu, mà chúng là mã của
# người khác nên chẳng ai cần đặt điểm dừng vào đó.
[profile.dev.package."*"]
opt-level = 3
